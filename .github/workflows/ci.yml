name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Тесты и качество
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          # Только лёгкие пакеты: тесты не требуют torch и моделей.
          # numpy обязателен — audio_utils/diarize/embeddings импортируют его
          # на уровне модуля, и без него падает сбор тестов.
          pip install pytest numpy requests python-dotenv
          # ffmpeg нужен тестам декодирования и конвертации в mp3.
          # imageio-ffmpeg даёт бинарник без прав суперпользователя.
          pip install imageio-ffmpeg faster-whisper

      - name: Синтаксис всех модулей
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for path in pathlib.Path(".").rglob("*.py"):
              if any(part in {".git", "android", ".venv"} for part in path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"))
              except SyntaxError as e:
                  bad.append(f"{path}: {e}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("синтаксис в порядке")
          PY

      - name: Тесты
        run: python -m pytest tests -q

      - name: Проверка формата HEX-JSON
        run: python output.py

      - name: Постобработка текста
        run: python llm.py

      - name: Метрики
        run: |
          python - <<'PY'
          from metrics import wer
          assert wer("привет мир", "привет мир") == 0.0
          assert wer("привет мир", "привет") > 0.0
          print("метрики в порядке")
          PY

  diarization:
    name: Качество диаризации (DER)
    runs-on: ubuntu-latest
    # Контрольный набор генерируется только на Windows (голоса SAPI),
    # поэтому в CI держим синтетическую проверку кластеризации без моделей.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install pytest numpy

      - name: Кластеризация и метрики без нейросетей
        run: python -m pytest tests -q -k "cluster or silhouette or der or windows"